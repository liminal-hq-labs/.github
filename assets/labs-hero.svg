<?xml version="1.0" encoding="UTF-8"?>
<!--
	Liminal HQ Labs hero banner: a lab bench where a flask of lime liquid bubbles and glows,
	safety goggles rest beside it and small notes drift up out of the flask.
	Self-contained dark panel in both colour schemes; still under prefers-reduced-motion.
	The wordmark is outlined from Adwaita Sans ExtraBold (SIL OFL) and sits between the
	hero-text markers. One 9 s loop: every animation starts at 0 and its length divides 9 s.

	(c) Copyright 2026 Liminal HQ, Scott Morris
	SPDX-License-Identifier: Apache-2.0 OR MIT
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="hero-title hero-desc" data-loop="9">
	<title id="hero-title">Liminal HQ Labs</title>
	<desc id="hero-desc">Liminal HQ Labs: experiments from Liminal HQ, early, rough and open. An animated banner shows a lab bench where a flask of glowing lime liquid bubbles, safety goggles rest beside it, test tubes stand in a rack and small formula notes drift up out of the flask.</desc>

	<style>
		.ui { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Adwaita Sans', Inter, sans-serif; }
		.mono { font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
		.bg-a { stop-color: #0c0e16; }
		.bg-b { stop-color: #161a28; }
		.edge { fill: none; stroke: #2a3040; }
		.static { display: none; }
		@media (prefers-color-scheme: dark) {
			.bg-a { stop-color: #050507; }
			.bg-b { stop-color: #0e1019; }
			.edge { stroke: #1d212c; }
		}
		@media (prefers-reduced-motion: reduce) {
			.motion { display: none; }
			.static { display: inline; }
		}
	</style>

	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop class="bg-a" offset="0"/>
			<stop class="bg-b" offset="1"/>
		</linearGradient>
		<linearGradient id="afterglow" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.55" stop-color="#ffaa40"/>
			<stop offset="1" stop-color="#f43f5e"/>
		</linearGradient>
		<linearGradient id="lab" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#a3e635"/>
			<stop offset="1" stop-color="#4ade80"/>
		</linearGradient>
		<linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#bef264"/>
			<stop offset="0.25" stop-color="#a3e635"/>
			<stop offset="1" stop-color="#4ade80"/>
		</linearGradient>
		<linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
			<stop offset="1" stop-color="#a78bfa" stop-opacity="0.22"/>
		</linearGradient>
		<linearGradient id="bench" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#b4bfce" stop-opacity="0"/>
			<stop offset="0.25" stop-color="#b4bfce" stop-opacity="0.4"/>
			<stop offset="0.75" stop-color="#b4bfce" stop-opacity="0.4"/>
			<stop offset="1" stop-color="#b4bfce" stop-opacity="0"/>
		</linearGradient>
		<radialGradient id="rose-wash">
			<stop offset="0" stop-color="#f43f5e" stop-opacity="0.14"/>
			<stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="purple-wash">
			<stop offset="0" stop-color="#a78bfa" stop-opacity="0.16"/>
			<stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
			<circle cx="12" cy="12" r="0.9" fill="#e0e0e0" opacity="0.07"/>
		</pattern>
		<filter id="haze" x="-60%" y="-60%" width="220%" height="220%">
			<feGaussianBlur stdDeviation="22"/>
		</filter>
		<filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="3"/>
		</filter>
		<filter id="labs-glow" x="-20%" y="-40%" width="140%" height="180%">
			<feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#4ade80" flood-opacity="0.45"/>
		</filter>
		<clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
		<clipPath id="flask-in"><path d="M886 94V151L830 239Q823 252 838 252H962Q977 252 970 239L914 151V94Z"/></clipPath>
		<clipPath id="lenses"><rect x="-56" y="-18" width="50" height="36" rx="15"/><rect x="6" y="-18" width="50" height="36" rx="15"/></clipPath>
		<path id="wave-a" d="M816 198Q840 192 864 198T912 198T960 198T1008 198V260H816Z"/>
	</defs>

	<g clip-path="url(#frame)">
		<rect data-bg="" width="1200" height="320" fill="url(#bg)"/>
		<rect width="1200" height="320" fill="url(#grid)"/>
		<circle cx="1130" cy="10" r="240" fill="url(#rose-wash)"/>
		<circle cx="70" cy="330" r="260" fill="url(#purple-wash)"/>

